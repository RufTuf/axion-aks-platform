trigger:
  - main

pool:
  name: Default

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/Axion_AKS_Infra/Environment/dev'
  serviceConnection: 'axion_service_connection'

  # Terraform Remote Backend
  backendResourceGroup: 'axion-rg1'
  backendStorageAccount: 'axionstg'
  backendContainer: 'axion-container'
  backendStateFile: 'axion-dev.tfstate'


# =========================================================
# STAGE 1 - Terraform Installation
# =========================================================
stages:

- stage: Terraform_Installation
  displayName: "Terraform Installation"

  jobs:
  - job: Terraform_Install
    displayName: "Install Terraform"

    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'


# =========================================================
# STAGE 2 - Terraform Init + Validate + Security Scans
# =========================================================
- stage: Terraform_Validation_Security
  displayName: "Terraform Validation & Security Scan"
  dependsOn: Terraform_Installation

  jobs:
  - job: Terraform_Validation
    displayName: "Init, Validate, TFSec & Checkov"

    steps:

    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendStateFile)'


    # -----------------------------------------------------
    # Terraform Validate
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Validate"
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'


    # -----------------------------------------------------
    # Install TFSec
    # -----------------------------------------------------
    - script: |
        brew install tfsec
      displayName: "Install TFSec"


    # -----------------------------------------------------
    # TFSec Security Scan
    # -----------------------------------------------------
    - script: |
        tfsec "$(terraformWorkingDirectory)" \
          --format junit \
          --out "$(Build.ArtifactStagingDirectory)/tfsec-results.xml"
      displayName: "TFSec Security Scan"


    # -----------------------------------------------------
    # Publish TFSec Results
    # -----------------------------------------------------
    - task: PublishTestResults@2
      displayName: "Publish TFSec Results"
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/tfsec-results.xml'
        testRunTitle: 'TFSec Security Scan'


    # -----------------------------------------------------
    # Install Checkov
    # -----------------------------------------------------
    - script: |
        python3 -m pip install --upgrade checkov
      displayName: "Install Checkov"


    # -----------------------------------------------------
    # Checkov Security Scan
    # -----------------------------------------------------
    - script: |
        checkov \
          -d "$(terraformWorkingDirectory)" \
          --output junitxml \
          --output-file-path "$(Build.ArtifactStagingDirectory)/checkov-results.xml"
      displayName: "Checkov Security Scan"


    # -----------------------------------------------------
    # Publish Checkov Results
    # -----------------------------------------------------
    - task: PublishTestResults@2
      displayName: "Publish Checkov Results"
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/checkov-results.xml'
        testRunTitle: 'Checkov Security Scan'


# =========================================================
# STAGE 3 - Terraform Plan
# =========================================================
- stage: Terraform_Plan
  displayName: "Terraform Plan"
  dependsOn: Terraform_Validation_Security

  jobs:
  - job: Terraform_Plan
    displayName: "Generate Terraform Plan"

    steps:

    # -----------------------------------------------------
    # Install Terraform
    # -----------------------------------------------------
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'


    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendStateFile)'


    # -----------------------------------------------------
    # Terraform Plan
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'

        commandOptions: '-out=$(terraformWorkingDirectory)/tfplan'


    # -----------------------------------------------------
    # Publish Terraform Plan
    # -----------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# =========================================================
# STAGE 4 - MANUAL APPROVAL
# =========================================================
- stage: Manual_Approval
  displayName: "Manual Approval"
  dependsOn: Terraform_Plan

  jobs:
  - job: Wait_For_Approval
    displayName: "Approve Terraform Apply"

    pool: server

    steps:

    - task: ManualValidation@1
      displayName: "Manual Approval Before Terraform Apply"

      timeoutInMinutes: 1440

      inputs:
        instructions: |
          Please review the Terraform Plan before applying.

          Validation completed:
          - Terraform Validate
          - TFSec Security Scan
          - Checkov Security Scan
          - Terraform Plan

          Approve this validation to proceed with Terraform Apply.

        onTimeout: 'reject'


# =========================================================
# STAGE 5 - TERRAFORM APPLY
# =========================================================
- stage: Terraform_Apply
  displayName: "Terraform Apply"
  dependsOn: Manual_Approval

  condition: succeeded()

  jobs:
  - job: Terraform_Apply
    displayName: "Apply Terraform Infrastructure"

    steps:

    # -----------------------------------------------------
    # Install Terraform
    # -----------------------------------------------------
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'


    # -----------------------------------------------------
    # Download Terraform Plan
    # -----------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"
      inputs:
        artifact: 'terraform-plan'
        path: '$(Pipeline.Workspace)/terraform-plan'


    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendStateFile)'


    # -----------------------------------------------------
    # Terraform Apply
    # -----------------------------------------------------
    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'

        commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'